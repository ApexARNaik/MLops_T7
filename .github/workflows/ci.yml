name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-serving.txt
      - name: Install serving and test dependencies
        run: python -m pip install -r requirements-serving.txt
      - name: Run tests
        run: python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t study-assistant:${{ github.sha }} .
      - name: Smoke test container
        shell: bash
        run: |
          docker run -d -p 8000:8000 --name study-assistant study-assistant:${{ github.sha }}
          trap 'docker rm -f study-assistant >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://localhost:8000/health; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/openapi.json >/dev/null
          if [[ -f models/learning_model.joblib && -f models/learning_meta.json && \
                -f models/answer_model.joblib && -f models/answer_meta.json ]]; then
            curl -fsS http://localhost:8000/ready
          else
            status="$(curl -sS -o /tmp/ready.json -w '%{http_code}' http://localhost:8000/ready)"
            test "$status" = "503"
            grep -q '"not_ready"' /tmp/ready.json
          fi