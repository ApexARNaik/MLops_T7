name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  secret-scan:
    name: Security - Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  backend-quality:
    name: Backend - Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install ruff pip-audit

      - name: Lint with Ruff
        run: |
          ruff check src/api src/hobby_learning src/common

      - name: Format check with Ruff
        run: |
          ruff format --check src/api src/hobby_learning src/common

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip-audit -r requirements-serving.txt --ignore-vuln GHSA-w73w-5m7g-f7qc || true

      - name: Execute PyTest test suite
        run: |
          python -m pytest -q

  docker-smoke-test:
    name: Backend - Docker Build & Smoke Test
    needs: [backend-quality, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build container
        run: docker build -t study-assistant:${{ github.sha }} .

      - name: Smoke test container
        shell: bash
        run: |
          docker run -d -p 8000:8000 --name study-assistant study-assistant:${{ github.sha }}
          trap 'docker rm -f study-assistant >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://localhost:8000/health; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/openapi.json >/dev/null
          if [[ -f models/learning_model.joblib && -f models/learning_meta.json && \
                -f models/answer_model.joblib && -f models/answer_meta.json ]]; then
            curl -fsS http://localhost:8000/ready
          else
            status="$(curl -sS -o /tmp/ready.json -w '%{http_code}' http://localhost:8000/ready)"
            test "$status" = "503"
            grep -q '"not_ready"' /tmp/ready.json
          fi

  frontend-quality:
    name: Frontend - Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate and Build Static Frontend
        shell: bash
        run: |
          node scripts/build_frontend.js
          test -f dist/index.html
          test -f dist/config.js
